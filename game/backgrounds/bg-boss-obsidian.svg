<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Void Storm Sky -->
    <linearGradient id="voidSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010a" />
      <stop offset="40%" stop-color="#190629" />
      <stop offset="75%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0a0312" />
    </linearGradient>
    <!-- Void Core Vortex -->
    <radialGradient id="vortexGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#7e22ce" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#3b0764" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05010a" stop-opacity="0" />
    </radialGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1280" height="720" fill="url(#voidSky)" />

  <!-- Swirling Void Vortex in Center Sky -->
  <circle cx="640" cy="240" r="320" fill="url(#vortexGlow)" />
  <g stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" fill="none" filter="url(#purpleGlow)">
    <ellipse cx="640" cy="240" rx="260" ry="120" transform="rotate(-15 640 240)" />
    <ellipse cx="640" cy="240" rx="180" ry="80" transform="rotate(25 640 240)" />
    <ellipse cx="640" cy="240" rx="100" ry="40" transform="rotate(-40 640 240)" />
  </g>

  <!-- Purple Lightning Bolts in Sky -->
  <g stroke="#e879f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#purpleGlow)" opacity="0.85">
    <path d="M 320 80 L 350 140 L 330 180 L 380 260" />
    <path d="M 960 90 L 930 150 L 950 190 L 910 270" />
    <path d="M 640 40 L 660 110 L 630 150 L 650 210" />
  </g>

  <!-- Giant Sharp Obsidian Pillars / Spires (Sarang Batu Obsidian Runcing) -->
  <!-- Far Spire Silhouettes -->
  <g fill="#12061f" stroke="#581c87" stroke-width="1.5">
    <polygon points="120,580 160,280 200,580" />
    <polygon points="260,560 290,320 320,560" />
    <polygon points="960,560 990,310 1020,560" />
    <polygon points="1080,580 1120,270 1160,580" />
  </g>

  <!-- Mid Ground Obsidian Monoliths with Violet Vein Cracks -->
  <g fill="#0a0312" stroke="#7e22ce" stroke-width="2.5">
    <!-- Left Huge Pillar -->
    <polygon points="40,620 90,210 140,620" />
    <path d="M 85 240 L 95 320 L 75 400 L 90 500" stroke="#c084fc" stroke-width="2" fill="none" filter="url(#purpleGlow)" />

    <!-- Right Huge Pillar -->
    <polygon points="1140,620 1190,210 1240,620" />
    <path d="M 1195 240 L 1185 320 L 1205 400 L 1190 500" stroke="#c084fc" stroke-width="2" fill="none" filter="url(#purpleGlow)" />

    <!-- Center Spire (Where Dark Pekat Roosts) -->
    <polygon points="560,580 640,320 720,580" />
    <path d="M 640 330 L 630 400 L 650 480 L 640 550" stroke="#e879f9" stroke-width="2.5" fill="none" filter="url(#purpleGlow)" />
  </g>

  <!-- Ground: Jagged Obsidian Crags (Ground Level) -->
  <path d="M 0 560 L 150 530 L 320 570 L 480 540 L 640 565 L 800 535 L 980 570 L 1120 535 L 1280 560 L 1280 720 L 0 720 Z" fill="#07020d" stroke="#3b0764" stroke-width="3" />
  <path d="M 0 600 L 250 580 L 500 610 L 750 585 L 1000 615 L 1280 590 L 1280 720 L 0 720 Z" fill="#040108" />

  <!-- Dripping Dark Void Sludge Wells on Ground -->
  <ellipse cx="360" cy="620" rx="75" ry="18" fill="#1e0b38" stroke="#7e22ce" stroke-width="2" />
  <ellipse cx="920" cy="630" rx="85" ry="20" fill="#1e0b38" stroke="#7e22ce" stroke-width="2" />
</svg>
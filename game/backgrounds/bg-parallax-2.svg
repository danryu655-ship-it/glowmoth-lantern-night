<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Vibrant Luminous Twilight Hill Gradients -->
    <linearGradient id="hillFarVibrant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163864" />
      <stop offset="50%" stop-color="#0e2848" />
      <stop offset="100%" stop-color="#07192f" />
    </linearGradient>
    <linearGradient id="hillMidVibrant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12485e" />
      <stop offset="50%" stop-color="#0a3242" />
      <stop offset="100%" stop-color="#061f29" />
    </linearGradient>
    <!-- Crystal Glowing Gradients -->
    <linearGradient id="cyanCrystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="mintCrystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#6ee7b7" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="forestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luminous Bioluminescent Fog Bank across Horizon -->
  <path d="M 0 420 Q 340 370 680 400 Q 1020 360 1280 410 L 1280 720 L 0 720 Z" fill="rgba(6, 182, 212, 0.12)" filter="url(#forestGlow)" />

  <!-- Far Mountain Ridge (Clearly Visible Sapphire Blue) -->
  <path d="M 0 430 Q 240 360 500 400 Q 820 340 1080 390 Q 1190 370 1280 400 L 1280 720 L 0 720 Z" fill="url(#hillFarVibrant)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Distant Crystal Pines on Far Ridge -->
  <g fill="#0c233f" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4">
    <!-- Group 1 -->
    <polygon points="90,420 102,340 114,420" />
    <polygon points="130,415 145,330 160,415" />
    <polygon points="210,405 224,345 238,405" />
    <polygon points="280,395 292,335 304,395" />
    <!-- Group 2 -->
    <polygon points="720,375 738,295 756,375" />
    <polygon points="780,380 795,315 810,380" />
    <polygon points="850,385 865,320 880,385" />
    <!-- Group 3 -->
    <polygon points="1040,395 1055,325 1070,395" />
    <polygon points="1120,400 1134,340 1148,400" />
  </g>

  <!-- Mid Ridge (Vibrant Emerald-Teal) -->
  <path d="M 0 480 Q 320 420 640 455 Q 960 410 1280 465 L 1280 720 L 0 720 Z" fill="url(#hillMidVibrant)" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.4" />

  <!-- Mid-Ground Glowing Crystal Pines (Full & Rich Forest) -->
  <g>
    <!-- Pine 1 -->
    <g transform="translate(70, 475)">
      <polygon points="0,-100 18,-40 -18,-40" fill="#093540" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="0,-65 24,0 -24,0" fill="#062933" stroke="#22d3ee" stroke-width="1.5" />
      <circle cx="0" cy="-102" r="3" fill="#67e8f9" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 2 -->
    <g transform="translate(160, 455)">
      <polygon points="0,-120 22,-50 -22,-50" fill="#0b3f4d" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,-75 28,0 -28,0" fill="#072d38" stroke="#10b981" stroke-width="1.5" />
      <circle cx="0" cy="-122" r="3.5" fill="#a7f3d0" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 3 -->
    <g transform="translate(260, 445)">
      <polygon points="0,-95 18,-35 -18,-35" fill="#093540" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="0,-60 22,0 -22,0" fill="#062933" stroke="#22d3ee" stroke-width="1.5" />
    </g>
    <!-- Pine 4 (Tall Hero Tree) -->
    <g transform="translate(420, 450)">
      <polygon points="0,-130 25,-55 -25,-55" fill="#0c4554" stroke="#67e8f9" stroke-width="2" />
      <polygon points="0,-80 32,0 -32,0" fill="#08313d" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="-132" r="4" fill="#ffffff" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 5 -->
    <g transform="translate(560, 460)">
      <polygon points="0,-105 20,-40 -20,-40" fill="#093540" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,-65 25,0 -25,0" fill="#062933" stroke="#10b981" stroke-width="1.5" />
      <circle cx="0" cy="-107" r="3" fill="#a7f3d0" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 6 -->
    <g transform="translate(710, 455)">
      <polygon points="0,-125 24,-50 -24,-50" fill="#0c4554" stroke="#67e8f9" stroke-width="2" />
      <polygon points="0,-75 30,0 -30,0" fill="#08313d" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="-127" r="4" fill="#ffffff" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 7 -->
    <g transform="translate(860, 435)">
      <polygon points="0,-110 20,-45 -20,-45" fill="#0b3f4d" stroke="#34d399" stroke-width="1.5" />
      <polygon points="0,-70 26,0 -26,0" fill="#072d38" stroke="#10b981" stroke-width="1.5" />
      <circle cx="0" cy="-112" r="3.5" fill="#a7f3d0" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 8 -->
    <g transform="translate(1010, 445)">
      <polygon points="0,-115 22,-45 -22,-45" fill="#093540" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="0,-70 28,0 -28,0" fill="#062933" stroke="#22d3ee" stroke-width="1.5" />
      <circle cx="0" cy="-117" r="3" fill="#67e8f9" filter="url(#forestGlow)" />
    </g>
    <!-- Pine 9 -->
    <g transform="translate(1160, 460)">
      <polygon points="0,-95 18,-35 -18,-35" fill="#093540" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="0,-60 24,0 -24,0" fill="#062933" stroke="#22d3ee" stroke-width="1.5" />
    </g>
  </g>

  <!-- Giant Glowing Crystal Monolith Formations (Jutting from the Hills) -->
  <!-- Crystal Cluster 1 (Left) -->
  <g transform="translate(200, 440)" filter="url(#forestGlow)">
    <polygon points="0,-75 14,-20 -6,-15" fill="url(#cyanCrystal)" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="12,-55 24,-10 6,-8" fill="url(#cyanCrystal)" opacity="0.85" />
    <polygon points="-12,-48 0,-8 -18,-10" fill="url(#cyanCrystal)" opacity="0.85" />
  </g>

  <!-- Crystal Cluster 2 (Center Right) -->
  <g transform="translate(780, 445)" filter="url(#forestGlow)">
    <polygon points="0,-85 16,-22 -8,-18" fill="url(#mintCrystal)" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="15,-60 28,-12 8,-10" fill="url(#mintCrystal)" opacity="0.85" />
    <polygon points="-14,-52 0,-10 -20,-12" fill="url(#mintCrystal)" opacity="0.85" />
  </g>

  <!-- Crystal Cluster 3 (Far Right) -->
  <g transform="translate(1080, 445)" filter="url(#forestGlow)">
    <polygon points="0,-70 14,-18 -6,-15" fill="url(#cyanCrystal)" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="12,-50 22,-8 6,-8" fill="url(#cyanCrystal)" opacity="0.85" />
  </g>

  <!-- Glowing Bioluminescent Mushrooms on Ridge Slopes -->
  <g fill="#f43f5e" filter="url(#forestGlow)">
    <path d="M 330 460 C 330 445 348 445 348 460 Z" />
    <path d="M 346 462 C 346 450 360 450 360 462 Z" fill="#ec4899" />
    <path d="M 620 468 C 620 452 638 452 638 468 Z" />
    <path d="M 940 450 C 940 435 958 435 958 450 Z" />
  </g>
  <g stroke="#e2e8f0" stroke-width="2" stroke-linecap="round">
    <line x1="339" y1="460" x2="339" y2="468" />
    <line x1="353" y1="462" x2="353" y2="470" />
    <line x1="629" y1="468" x2="629" y2="476" />
    <line x1="949" y1="450" x2="949" y2="458" />
  </g>

  <!-- Floating Crystal Spores / Motes in Forest Air -->
  <g fill="#67e8f9" filter="url(#forestGlow)">
    <circle cx="120" cy="380" r="3.5" opacity="0.9" />
    <circle cx="180" cy="360" r="2.5" opacity="0.75" />
    <circle cx="230" cy="400" r="3" opacity="0.85" />
    <circle cx="450" cy="380" r="4" opacity="0.95" />
    <circle cx="500" cy="420" r="2.5" opacity="0.7" />
    <circle cx="730" cy="370" r="3.5" opacity="0.9" />
    <circle cx="810" cy="390" r="4" opacity="0.95" />
    <circle cx="900" cy="360" r="3" opacity="0.8" />
    <circle cx="1060" cy="380" r="3.5" opacity="0.9" />
    <circle cx="1120" cy="410" r="2.5" opacity="0.7" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Button Gradient -->
    <radialGradient id="shieldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="65%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <!-- Cyan / Ice Blue Rim Gradient -->
    <linearGradient id="shieldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <!-- Shield Core Gradient -->
    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2" />
    </radialGradient>
    <!-- Glow Filter -->
    <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Base Shadow -->
  <circle cx="128" cy="132" r="114" fill="#000000" opacity="0.6" filter="blur(8px)" />

  <!-- Outer Ring (Ice Metal Border) -->
  <circle cx="128" cy="128" r="116" fill="url(#shieldRim)" />
  <circle cx="128" cy="128" r="108" fill="#0b1120" />
  
  <!-- Inner Background -->
  <circle cx="128" cy="128" r="102" fill="url(#shieldBg)" />

  <!-- Hexagonal Tech Shield Contour -->
  <g filter="url(#iceGlow)">
    <!-- Outer Shield Crest -->
    <path d="M 128 48 L 196 74 L 196 142 C 196 178 128 208 128 208 C 128 208 60 178 60 142 L 60 74 Z" 
          fill="url(#hexGlow)" stroke="#bae6fd" stroke-width="4.5" opacity="0.9" />

    <!-- Inner Shield Inset -->
    <path d="M 128 66 L 180 86 L 180 138 C 180 166 128 190 128 190 C 128 190 76 166 76 138 L 76 86 Z" 
          fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Hexagonal Honeycomb Matrix Patterns -->
  <g stroke="#e0f2fe" stroke-width="2" fill="none" opacity="0.75">
    <!-- Center Hexagon -->
    <polygon points="128,102 144,111 144,130 128,139 112,130 112,111" fill="rgba(186, 230, 253, 0.4)" />
    <!-- Top Hexagon -->
    <polygon points="128,74 144,83 144,102 128,111 112,102 112,83" />
    <!-- Bottom Hexagon -->
    <polygon points="128,130 144,139 144,158 128,167 112,158 112,139" />
    <!-- Left Hexagon -->
    <polygon points="103,88 119,97 119,116 103,125 87,116 87,97" />
    <!-- Right Hexagon -->
    <polygon points="153,88 169,97 169,116 153,125 137,116 137,97" />
  </g>

  <!-- Shield Core Energy Spark -->
  <circle cx="128" cy="120" r="10" fill="#ffffff" filter="url(#iceGlow)" />
  <circle cx="128" cy="120" r="5" fill="#f0f9ff" />

  <!-- Glass Highlight Curve -->
  <path d="M 40 100 A 96 96 0 0 1 216 100 A 96 70 0 0 0 40 100 Z" fill="#ffffff" opacity="0.18" />
</svg>
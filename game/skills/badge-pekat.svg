<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <!-- Radiant Royal Gold Rim Gradient -->
    <linearGradient id="goldChampion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="90%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <!-- Central Midnight to Dawn Gradient -->
    <radialGradient id="dawnCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#1e0c38" />
    </radialGradient>
    <filter id="championGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow -->
  <circle cx="140" cy="148" r="105" fill="#000000" opacity="0.65" filter="blur(8px)" />

  <!-- 12-Point Starburst Background Rim (Emperor / Boss Conqueror) -->
  <path d="M 140 18 L 165 42 L 200 35 L 210 70 L 244 85 L 235 120 L 255 148 L 235 176 L 244 211 L 210 226 L 200 261 L 165 254 L 140 278 L 115 254 L 80 261 L 70 226 L 36 211 L 45 176 L 25 148 L 45 120 L 36 85 L 70 70 L 80 35 L 115 42 Z" 
        fill="url(#goldChampion)" stroke="#fef08a" stroke-width="2.5" />

  <!-- Inner Dark Void Rim (Representing Defeated Dark Pekat) -->
  <circle cx="140" cy="148" r="95" fill="#090514" stroke="#a855f7" stroke-width="3" />
  <circle cx="140" cy="148" r="88" fill="url(#dawnCenter)" />

  <!-- Shattered Obsidian Shards of Dark Pekat at Base -->
  <g fill="#180b29" stroke="#9333ea" stroke-width="2" opacity="0.9">
    <polygon points="110,180 125,160 140,185 115,190" />
    <polygon points="140,185 155,165 170,182 150,192" />
    <polygon points="85,165 105,155 112,175 92,180" />
    <polygon points="168,175 175,155 195,165 188,180" />
  </g>

  <!-- Golden Crown of Dawn & Radiant Flame of Victory -->
  <g filter="url(#championGlow)">
    <!-- Sunburst Radiance Rays -->
    <path d="M 140 70 L 146 115 L 185 125 L 146 135 L 140 180 L 134 135 L 95 125 L 134 115 Z" fill="#ffffff" opacity="0.9" />

    <!-- Crown of Dawn -->
    <polygon points="110,140 115,108 128,122 140,96 152,122 165,108 170,140" fill="#facc15" stroke="#ffffff" stroke-width="2" />
    <!-- Ruby / Amethyst Crown Gem -->
    <circle cx="140" cy="125" r="7" fill="#dc2626" stroke="#fef08a" stroke-width="1.5" />
    
    <!-- Central Golden Flame Core -->
    <circle cx="140" cy="125" r="14" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Banner at Bottom -->
  <g>
    <path d="M 45 220 L 140 206 L 235 220 L 222 248 L 140 234 L 58 248 Z" fill="#180b29" stroke="url(#goldChampion)" stroke-width="3" />
    <text x="140" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#fde047" text-anchor="middle" letter-spacing="1.5">BANE OF DARK PEKAT</text>
    <text x="140" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">VICTORY • DAWN RESTORED</text>
  </g>
</svg>
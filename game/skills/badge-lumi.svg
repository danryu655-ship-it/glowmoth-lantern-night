<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <!-- Silver Medal Gradient -->
    <linearGradient id="silverRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <!-- Mint Glow -->
    <radialGradient id="mintCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shadow -->
  <polygon points="140,24 235,76 235,188 140,240 45,188 45,76" fill="#000000" opacity="0.6" transform="translate(0, 10)" />

  <!-- Octagonal / Shield Frame -->
  <polygon points="140,24 235,76 235,188 140,240 45,188 45,76" fill="url(#silverRim)" stroke="#f1f5f9" stroke-width="3" />
  <polygon points="140,36 223,82 223,182 140,228 57,182 57,82" fill="#0f172a" />
  <polygon points="140,44 215,86 215,178 140,220 65,178 65,86" fill="url(#mintCenter)" />

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <g fill="#a7f3d0" stroke="#047857" stroke-width="1.5" opacity="0.85">
    <ellipse cx="80" cy="110" rx="9" ry="16" transform="rotate(-30 80 110)" />
    <ellipse cx="74" cy="140" rx="9" ry="16" transform="rotate(-15 74 140)" />
    <ellipse cx="82" cy="170" rx="9" ry="16" transform="rotate(15 82 170)" />

    <ellipse cx="200" cy="110" rx="9" ry="16" transform="rotate(30 200 110)" />
    <ellipse cx="206" cy="140" rx="9" ry="16" transform="rotate(15 206 140)" />
    <ellipse cx="198" cy="170" rx="9" ry="16" transform="rotate(-15 198 170)" />
  </g>

  <!-- Central Symbol: Lumi's Mint Lantern & Wings -->
  <g filter="url(#badgeGlow)">
    <!-- Mint Firefly Wings -->
    <ellipse cx="110" cy="120" rx="26" ry="12" transform="rotate(-25 110 120)" fill="rgba(209, 250, 229, 0.75)" stroke="#6ee7b7" stroke-width="2" />
    <ellipse cx="170" cy="120" rx="26" ry="12" transform="rotate(25 170 120)" fill="rgba(209, 250, 229, 0.75)" stroke="#6ee7b7" stroke-width="2" />

    <!-- Lantern Frame -->
    <path d="M 125 95 L 155 95 L 160 145 L 120 145 Z" fill="#fef08a" opacity="0.9" />
    <polygon points="120,95 160,95 152,85 128,85" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <polygon points="120,145 160,145 152,155 128,155" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    
    <!-- Central Lantern Core Flame -->
    <circle cx="140" cy="120" r="12" fill="#ffffff" />
    <circle cx="140" cy="120" r="6" fill="#fef08a" />
  </g>

  <!-- Banner at Bottom -->
  <g>
    <path d="M 60 215 L 140 200 L 220 215 L 210 238 L 140 226 L 70 238 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5" />
    <text x="140" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">LUMI'S SAVIOR</text>
    <text x="140" y="233" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle">NIGHT 3 CLEARED</text>
  </g>

  <!-- 3 Stars on Top -->
  <g fill="#fef08a">
    <polygon points="140,48 143,55 150,56 145,61 146,68 140,64 134,68 135,61 130,56 137,55" />
    <polygon points="118,56 120,62 126,63 122,67 123,73 118,70 113,73 114,67 110,63 116,62" transform="scale(0.85) translate(22, 10)" />
    <polygon points="162,56 164,62 170,63 166,67 167,73 162,70 157,73 158,67 154,63 160,62" transform="scale(0.85) translate(30, 10)" />
  </g>
</svg>
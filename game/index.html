<style>
  :root { color-scheme: dark; }

  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

</style>

<canvas id="game" aria-label="Glowmoth: Lantern Night. Fly the moth with WASD, the arrow keys or the mouse. Collect golden motes to light four lanterns, press Space or click to flare and push the shadows away, and keep the meadow alight for three nights."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>

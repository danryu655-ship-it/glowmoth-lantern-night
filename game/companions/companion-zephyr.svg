<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <radialGradient id="cosmicAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#7e22ce" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e0b38" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="zephyrBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="45%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="cosmicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="140" cy="140" r="130" fill="url(#cosmicAura)" />

  <!-- Cosmic Halo Ring (Cincin Halo Kosmik Berputar) -->
  <ellipse cx="140" cy="140" rx="90" ry="24" transform="rotate(-15 140 140)" fill="none" stroke="#e879f9" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.75" />
  <circle cx="60" cy="160" r="3" fill="#ffffff" filter="url(#cosmicGlow)" />
  <circle cx="218" cy="120" r="3" fill="#ffffff" filter="url(#cosmicGlow)" />

  <!-- Cosmic Fairy Wings (Sayap Kristal Galaksi) -->
  <!-- Left Wing -->
  <g filter="url(#cosmicGlow)">
    <path d="M 120 120 C 55 65 30 95 48 135 C 65 170 110 145 120 120 Z" fill="rgba(245, 208, 254, 0.75)" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="70" cy="115" r="2.5" fill="#ffffff" />
    <circle cx="85" cy="130" r="2" fill="#ffffff" />
  </g>
  <!-- Right Wing -->
  <g filter="url(#cosmicGlow)">
    <path d="M 160 120 C 225 65 250 95 232 135 C 215 170 170 145 160 120 Z" fill="rgba(245, 208, 254, 0.75)" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="210" cy="115" r="2.5" fill="#ffffff" />
    <circle cx="195" cy="130" r="2" fill="#ffffff" />
  </g>

  <!-- Glowing Amethyst Abdomen (Perut Lentera Kosmik Zephyr) -->
  <g filter="url(#cosmicGlow)">
    <ellipse cx="140" cy="195" rx="36" ry="30" fill="#a855f7" />
    <ellipse cx="140" cy="195" rx="24" ry="18" fill="#f0abfc" />
    <circle cx="140" cy="195" r="10" fill="#ffffff" />
  </g>
  <!-- Abdomen Shell Stripes -->
  <path d="M 114 188 Q 140 202 166 188" stroke="#6b21a8" stroke-width="3" fill="none" />
  <path d="M 118 202 Q 140 216 162 202" stroke="#6b21a8" stroke-width="3" fill="none" />

  <!-- Thorax / Dada -->
  <ellipse cx="140" cy="148" rx="22" ry="20" fill="#3b0764" stroke="#1e0b38" stroke-width="3" />

  <!-- Hands & Feet -->
  <path d="M 125 152 Q 105 160 112 170" stroke="#1e0b38" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 155 152 Q 175 160 168 170" stroke="#1e0b38" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Head (Kepala Ungu Lilac Lucu) -->
  <ellipse cx="140" cy="108" rx="32" ry="28" fill="url(#zephyrBody)" stroke="#581c87" stroke-width="3" />

  <!-- Celestial Antennae (Antena Bintang Kosmik) -->
  <path d="M 128 84 Q 110 50 118 35" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <polygon points="118,28 122,34 128,35 124,39 125,45 118,42 112,45 113,39 109,34 115,34" fill="#f0abfc" filter="url(#cosmicGlow)" />

  <path d="M 152 84 Q 170 50 162 35" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <polygon points="162,28 166,34 172,35 168,39 169,45 162,42 156,45 157,39 153,34 159,34" fill="#f0abfc" filter="url(#cosmicGlow)" />

  <!-- Big Cosmic Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="127" cy="106" rx="11" ry="14" fill="#180b29" />
    <circle cx="124" cy="101" r="4.5" fill="#ffffff" />
    <circle cx="130" cy="111" r="2" fill="#f0abfc" />

    <!-- Right Eye -->
    <ellipse cx="153" cy="106" rx="11" ry="14" fill="#180b29" />
    <circle cx="150" cy="101" r="4.5" fill="#ffffff" />
    <circle cx="156" cy="111" r="2" fill="#f0abfc" />
  </g>

  <!-- Sweet Smile & Lilac Blush -->
  <path d="M 134 120 Q 140 128 146 120" stroke="#3b0764" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="118" cy="118" r="4.5" fill="#e879f9" opacity="0.6" />
  <circle cx="162" cy="118" r="4.5" fill="#e879f9" opacity="0.6" />
</svg>
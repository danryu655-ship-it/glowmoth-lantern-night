<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="nightSky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#081e28" />
    </linearGradient>
    <!-- Lulu Ice Blue Radiance -->
    <radialGradient id="iceBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>
    <filter id="sceneGlow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#nightSky6)" />

  <!-- Stars & Purple Nebula Tint -->
  <g fill="#dfeaff" opacity="0.65">
    <circle cx="210" cy="80" r="1.5" />
    <circle cx="450" cy="110" r="2" />
    <circle cx="780" cy="60" r="1.8" />
    <circle cx="1050" cy="130" r="2.2" />
  </g>
  <ellipse cx="640" cy="280" rx="360" ry="200" fill="rgba(147, 51, 234, 0.12)" filter="url(#sceneGlow6)" />

  <!-- Giant Hexagonal Aegis Shield Blossoming from Lulu -->
  <g transform="translate(640, 310)" filter="url(#sceneGlow6)">
    <!-- Expanding Hex Barrier -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12,8" />
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="rgba(125, 211, 252, 0.2)" stroke="#bae6fd" stroke-width="2.5" />
  </g>

  <!-- Shattered Ice-Obsidian Shards Flying Apart -->
  <g fill="#0c192c" stroke="#38bdf8" stroke-width="2">
    <polygon points="520,180 545,160 560,195 530,205" />
    <polygon points="760,190 785,170 795,205 770,215" />
    <polygon points="490,380 515,360 530,395 500,405" />
    <polygon points="750,380 775,360 790,395 760,405" />
  </g>

  <!-- LULU (Center): Awakening with Protective Shield -->
  <g transform="translate(640, 310)">
    <circle cx="0" cy="0" r="110" fill="url(#iceBurst)" filter="url(#sceneGlow6)" />

    <!-- Lulu Ice Wings -->
    <ellipse cx="-45" cy="-25" rx="55" ry="24" transform="rotate(-30 -45 -25)" fill="rgba(224, 242, 254, 0.85)" stroke="#38bdf8" stroke-width="2.5" />
    <ellipse cx="45" cy="-25" rx="55" ry="24" transform="rotate(30 45 -25)" fill="rgba(224, 242, 254, 0.85)" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Abdomen Blue Core -->
    <ellipse cx="0" cy="38" rx="30" ry="25" fill="#7dd3fc" />
    <circle cx="0" cy="38" r="14" fill="#ffffff" />

    <!-- Head & Body -->
    <ellipse cx="0" cy="-18" rx="28" ry="25" fill="#8ecbff" stroke="#0284c7" stroke-width="2.5" />
    <ellipse cx="-10" cy="-20" rx="9" ry="12" fill="#082f49" />
    <circle cx="-12" cy="-23" r="4" fill="#ffffff" />
    <ellipse cx="10" cy="-20" rx="9" ry="12" fill="#082f49" />
    <circle cx="8" cy="-23" r="4" fill="#ffffff" />
    <path d="M -6 -8 Q 0 -2 6 -8" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- LUMA (Left): Hovering proudly with Gold Glow -->
  <g transform="translate(360, 320)">
    <circle cx="0" cy="0" r="85" fill="rgba(250, 204, 21, 0.4)" filter="url(#sceneGlow6)" />
    <ellipse cx="-35" cy="-15" rx="42" ry="18" transform="rotate(-30 -35 -15)" fill="#fef08a" stroke="#eab308" stroke-width="2" />
    <ellipse cx="35" cy="-15" rx="42" ry="18" transform="rotate(30 35 -15)" fill="#fef08a" stroke="#eab308" stroke-width="2" />
    <ellipse cx="0" cy="28" rx="22" ry="18" fill="#fde047" />
    <ellipse cx="0" cy="-14" rx="22" ry="20" fill="#86efac" stroke="#166534" stroke-width="2" />
    <circle cx="-8" cy="-15" r="4" fill="#ffffff" />
    <circle cx="8" cy="-15" r="4" fill="#ffffff" />
  </g>

  <!-- LUMI (Right): Floating happily with Mint Glow -->
  <g transform="translate(920, 320)">
    <circle cx="0" cy="0" r="85" fill="rgba(52, 211, 153, 0.4)" filter="url(#sceneGlow6)" />
    <ellipse cx="-35" cy="-15" rx="42" ry="18" transform="rotate(-30 -35 -15)" fill="#a7f3d0" stroke="#10b981" stroke-width="2" />
    <ellipse cx="35" cy="-15" rx="42" ry="18" transform="rotate(30 35 -15)" fill="#a7f3d0" stroke="#10b981" stroke-width="2" />
    <ellipse cx="0" cy="28" rx="22" ry="18" fill="#6ee7b7" />
    <ellipse cx="0" cy="-14" rx="22" ry="20" fill="#8ff0d0" stroke="#047857" stroke-width="2" />
    <circle cx="-8" cy="-15" r="4" fill="#ffffff" />
    <circle cx="8" cy="-15" r="4" fill="#ffffff" />
  </g>

  <!-- Cutscene Header Text Card -->
  <g text-anchor="middle">
    <rect x="360" y="35" width="560" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2" />
    <text x="640" y="67" font-family="'Cinzel', serif" font-weight="900" font-size="22" fill="#7dd3fc" letter-spacing="4">
      MALAM KE-6 • TRIO CAHAYA BERSATU
    </text>
  </g>

  <!-- Dialogue Box Overlay -->
  <g>
    <rect x="140" y="575" width="1000" height="115" rx="22" fill="rgba(10, 15, 29, 0.93)" stroke="#38bdf8" stroke-width="2.5" />
    <text x="180" y="608" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#7dd3fc" letter-spacing="1">
      LULU:
    </text>
    <text x="180" y="638" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="15" fill="#f1f5f9">
      <tspan x="180" dy="0">"Kalian datang...! Aku bebas! Sekarang kita bertiga—</tspan>
      <tspan x="180" dy="25">aku akan memasang perisai pelindung untuk menjaga kita dari Dark Pekat!"</tspan>
    </text>
  </g>
</svg>
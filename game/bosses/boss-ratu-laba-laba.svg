<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="spiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#3b0764" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chitinObsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#381c5a" />
      <stop offset="35%" stop-color="#190d2e" />
      <stop offset="80%" stop-color="#0a0514" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    <filter id="purpleNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="160" cy="160" r="140" fill="url(#spiderGlow)" />

  <!-- Shadow Web Threads (Background) -->
  <g stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <path d="M 160 160 L 30 50 M 160 160 L 290 50 M 160 160 L 290 270 M 160 160 L 30 270 M 160 160 L 160 20 M 160 160 L 160 300 M 160 160 L 10 160 M 160 160 L 310 160" />
    <polygon points="160,80 220,110 240,160 220,210 160,240 100,210 80,160 100,110" />
    <polygon points="160,45 255,85 285,160 255,235 160,275 65,235 35,160 65,85" />
  </g>

  <!-- Spider Legs (8 Sharp Jointed Shadow Limbs) -->
  <g stroke="#1a0c30" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Top Leg -->
    <path d="M 135 130 Q 80 70 45 60 Q 30 85 20 120" />
    <!-- Left Mid-Top Leg -->
    <path d="M 130 145 Q 70 120 40 140 Q 25 165 20 195" />
    <!-- Left Mid-Bottom Leg -->
    <path d="M 130 165 Q 75 180 50 215 Q 40 240 35 270" />
    <!-- Left Bottom Leg -->
    <path d="M 135 180 Q 90 225 75 260 Q 65 285 55 305" />

    <!-- Right Top Leg -->
    <path d="M 185 130 Q 240 70 275 60 Q 290 85 300 120" />
    <!-- Right Mid-Top Leg -->
    <path d="M 190 145 Q 250 120 280 140 Q 295 165 300 195" />
    <!-- Right Mid-Bottom Leg -->
    <path d="M 190 165 Q 245 180 270 215 Q 280 240 285 270" />
    <!-- Right Bottom Leg -->
    <path d="M 185 180 Q 230 225 245 260 Q 255 285 265 305" />
  </g>

  <!-- Glowing Violet Joint Armor Accents -->
  <g stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#purpleNeon)">
    <path d="M 80 70 L 45 60 M 240 70 L 275 60" />
    <path d="M 70 120 L 40 140 M 250 120 L 280 140" />
    <path d="M 75 180 L 50 215 M 245 180 L 270 215" />
  </g>

  <!-- Abdomen / Perut Laba-laba Raksasa -->
  <ellipse cx="160" cy="205" rx="46" ry="62" fill="url(#chitinObsidian)" stroke="#7e22ce" stroke-width="3.5" />
  <!-- Skull/Crown Sigil on Abdomen -->
  <g fill="#c084fc" opacity="0.85" filter="url(#purpleNeon)">
    <polygon points="160,165 175,185 160,195 145,185" />
    <circle cx="160" cy="215" r="9" />
    <circle cx="148" cy="235" r="5" />
    <circle cx="172" cy="235" r="5" />
    <path d="M 152 245 Q 160 252 168 245" stroke="#e879f9" stroke-width="2" fill="none" />
  </g>

  <!-- Cephalothorax / Kepala & Dada Berduri -->
  <polygon points="160,105 188,135 180,172 140,172 132,135" fill="url(#chitinObsidian)" stroke="#a855f7" stroke-width="3" />
  
  <!-- Crown of Spines on Head -->
  <polygon points="135,108 125,85 142,102" fill="#381c5a" stroke="#c084fc" stroke-width="1.5" />
  <polygon points="185,108 195,85 178,102" fill="#381c5a" stroke="#c084fc" stroke-width="1.5" />
  <polygon points="160,98 160,72 166,96" fill="#a855f7" />

  <!-- 8 Glowing Crimson / Ruby Eyes -->
  <g fill="#ef4444" filter="url(#purpleNeon)">
    <!-- 2 Main Predatory Eyes -->
    <ellipse cx="152" cy="132" rx="7" ry="10" transform="rotate(-10 152 132)" />
    <ellipse cx="168" cy="132" rx="7" ry="10" transform="rotate(10 168 132)" />
    <!-- Secondary Eyes -->
    <circle cx="140" cy="128" r="4.5" />
    <circle cx="180" cy="128" r="4.5" />
    <circle cx="142" cy="144" r="3.5" />
    <circle cx="178" cy="144" r="3.5" />
    <circle cx="154" cy="148" r="3" />
    <circle cx="166" cy="148" r="3" />
  </g>

  <!-- Dripping Poison Fangs (Chelicerae) -->
  <path d="M 150 158 Q 146 178 140 186 Q 148 180 154 165 Z" fill="#ffffff" stroke="#c084fc" stroke-width="1" />
  <path d="M 170 158 Q 174 178 180 186 Q 172 180 166 165 Z" fill="#ffffff" stroke="#c084fc" stroke-width="1" />
  <circle cx="140" cy="188" r="2.5" fill="#a855f7" />
  <circle cx="180" cy="188" r="2.5" fill="#a855f7" />
</svg>
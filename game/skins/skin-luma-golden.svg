<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Solar Aura -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0" />
    </radialGradient>
    <!-- Royal Gold Armor Gradient -->
    <linearGradient id="solarGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <!-- Fiery Solar Wing Gradient -->
    <linearGradient id="solarWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.3" />
    </linearGradient>
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Giant Solar Aura Background -->
  <circle cx="160" cy="160" r="145" fill="url(#sunAura)" />

  <!-- Solar Wings (Fiery Wing Blades) -->
  <!-- Left Top Wing -->
  <ellipse cx="80" cy="115" rx="75" ry="32" transform="rotate(-35 80 115)" fill="url(#solarWing)" stroke="#facc15" stroke-width="2.5" />
  <path d="M 80 115 Q 40 90 20 100 Q 60 120 120 135" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Left Bottom Wing -->
  <ellipse cx="95" cy="160" rx="55" ry="22" transform="rotate(-15 95 160)" fill="url(#solarWing)" stroke="#f59e0b" stroke-width="2" />

  <!-- Right Top Wing -->
  <ellipse cx="240" cy="115" rx="75" ry="32" transform="rotate(35 240 115)" fill="url(#solarWing)" stroke="#facc15" stroke-width="2.5" />
  <path d="M 240 115 Q 280 90 300 100 Q 260 120 200 135" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Right Bottom Wing -->
  <ellipse cx="225" cy="160" rx="55" ry="22" transform="rotate(15 225 160)" fill="url(#solarWing)" stroke="#f59e0b" stroke-width="2" />

  <!-- Abdomen: Miniature Supernova Sun Reactor -->
  <g filter="url(#sunGlow)">
    <circle cx="160" cy="225" r="46" fill="#fef08a" />
    <circle cx="160" cy="225" r="32" fill="#ffffff" />
    <!-- Sun Ray Corona Flashes -->
    <path d="M 160 170 L 164 220 L 215 225 L 164 230 L 160 280 L 156 230 L 105 225 L 156 220 Z" fill="#ffffff" opacity="0.85" />
  </g>
  <!-- Gold Cage Guard on Abdomen -->
  <path d="M 125 210 Q 160 235 195 210" stroke="#ca8a04" stroke-width="3" fill="none" />
  <path d="M 130 230 Q 160 255 190 230" stroke="#ca8a04" stroke-width="3" fill="none" />

  <!-- Gold Armored Thorax (Chest Plate with Sun Sigil) -->
  <path d="M 135 145 L 185 145 L 175 190 L 145 190 Z" fill="url(#solarGold)" stroke="#78350f" stroke-width="3" />
  <!-- Radiant Sun Crest on Chest -->
  <circle cx="160" cy="166" r="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />

  <!-- Golden Armored Arms & Legs -->
  <path d="M 135 160 Q 110 170 120 185" stroke="url(#solarGold)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 185 160 Q 210 170 200 185" stroke="url(#solarGold)" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 145 188 Q 135 210 142 225" stroke="url(#solarGold)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 175 188 Q 185 210 178 225" stroke="url(#solarGold)" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Solar Helmet & Head -->
  <ellipse cx="160" cy="115" rx="42" ry="36" fill="url(#solarGold)" stroke="#78350f" stroke-width="3.5" />
  <!-- Golden Crown Fin / Forehead Crest -->
  <polygon points="160,70 170,95 150,95" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  <!-- Solar Antennae -->
  <path d="M 145 88 Q 120 50 115 32 Q 132 42 135 68" fill="#facc15" stroke="#854d0e" stroke-width="2" />
  <path d="M 175 88 Q 200 50 205 32 Q 188 42 185 68" fill="#facc15" stroke="#854d0e" stroke-width="2" />

  <!-- Big Heroic Eyes with Sun Amber Glint -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="142" cy="112" rx="14" ry="17" fill="#180b02" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="138" cy="106" r="5.5" fill="#ffffff" />
    <circle cx="145" cy="118" r="2.5" fill="#fde047" />

    <!-- Right Eye -->
    <ellipse cx="178" cy="112" rx="14" ry="17" fill="#180b02" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="174" cy="106" r="5.5" fill="#ffffff" />
    <circle cx="181" cy="118" r="2.5" fill="#fde047" />
  </g>

  <!-- Confident Hero Smile -->
  <path d="M 152 130 Q 160 138 168 130" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>